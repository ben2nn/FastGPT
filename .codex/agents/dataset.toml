# FastGPT 知识库(Dataset)模块架构说明\r
\r
## 概述\r
\r
FastGPT 知识库模块是一个基于 MongoDB + PostgreSQL(向量数据库) 的 RAG(检索增强生成)知识库系统,支持多种数据源导入、智能文档分块、向量化索引、混合检索等核心能力。\r
\r
## 核心概念层次结构\r
\r
```\r
Dataset (知识库)\r
  ├── DatasetCollection (文档集合/文件)\r
  │     ├── DatasetData (数据块/Chunk)\r
  │     │     ├── indexes[] (向量索引)\r
  │     │     └── history[] (历史版本)\r
  │     └── DatasetTraining (训练队列)\r
  └── Tag (标签系统)\r
```\r
\r
### 1. Dataset (知识库)\r
- **作用**: 最顶层容器,可以是普通知识库、文件夹、网站知识库或外部数据源\r
- **类型**:\r
  - `folder`: 文件夹组织\r
  - `dataset`: 普通知识库\r
  - `websiteDataset`: 网站深度链接\r
  - `apiDataset`: API 数据集\r
  - `feishu`: 飞书知识库\r
  - `yuque`: 语雀知识库\r
  - `externalFile`: 外部文件\r
\r
### 2. DatasetCollection (文档集合)\r
- **作用**: 知识库中的具体文件或文档,承载原始数据\r
- **类型**:\r
  - `folder`: 文件夹\r
  - `file`: 本地文件\r
  - `link`: 单个链接\r
  - `apiFile`: API 文件\r
  - `images`: 图片集合\r
  - `virtual`: 虚拟集合\r
\r
### 3. DatasetData (数据块)\r
- **作用**: 文档分块后的最小知识单元,实际检索的对象\r
- **核心字段**:\r
  - `q`: 问题或大块文本\r
  - `a`: 答案或自定义内容\r
  - `indexes[]`: 向量索引列表(可多个)\r
  - `chunkIndex`: 块索引位置\r
  - `imageId`: 关联图片ID\r
  - `history[]`: 修改历史\r
\r
### 4. DatasetTraining (训练队列)\r
- **作用**: 异步训练任务队列,负责向量化和索引生成\r
- **训练模式**:\r
  - `chunk`: 文本分块\r
  - `qa`: 问答对\r
  - `image`: 图像处理\r
  - `imageParse`: 图像解析\r
\r
