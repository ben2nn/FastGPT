## 性能优化要点\r
\r
### 1. 索引优化\r
```javascript\r
// 核心复合索引\r
DatasetCollection:\r
  - { teamId: 1, datasetId: 1, parentId: 1, updateTime: -1 }\r
  - { teamId: 1, datasetId: 1, tags: 1 }\r
\r
DatasetData:\r
  - { teamId: 1, datasetId: 1, collectionId: 1, chunkIndex: 1, updateTime: -1 }\r
  - { teamId: 1, datasetId: 1, collectionId: 1, 'indexes.dataId': 1 }\r
\r
DatasetTraining:\r
  - { mode: 1, retryCount: 1, lockTime: 1, weight: -1 }\r
```\r
\r
### 2. 查询优化\r
```typescript\r
// 使用从库读取(降低主库压力)\r
const readFromSecondary = {\r
  readPreference: 'secondaryPreferred'\r
};\r
\r
MongoDatasetData.find(query, fields, {\r
  ...readFromSecondary\r
}).lean();\r
```\r
\r
### 3. 分页优化\r
```typescript\r
// 使用 scrollList 而非传统分页\r
// 避免深度分页性能问题\r
GET /api/core/dataset/collection/scrollList?lastId=xxx&limit=20\r
```\r
\r
### 4. 缓存策略\r
```typescript\r
// Redis 缓存热门检索结果\r
const cacheKey = `dataset:search:${hashQuery(query)}`;\r
const cached = await redis.get(cacheKey);\r
if (cached) return JSON.parse(cached);\r
\r
// 缓存 5 分钟\r
await redis.setex(cacheKey, 300, JSON.stringify(results));\r
```\r
