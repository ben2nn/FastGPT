}\r
```\r
\r
### 4. 训练队列机制\r
\r
**位置**: `packages/service/core/dataset/training/controller.ts`\r
\r
```typescript\r
// 训练队列调度\r
class TrainingQueue {\r
  // 1. 获取待训练任务(按权重排序)\r
  async getNextTrainingTask() {\r
    return MongoDatasetTraining.findOne({\r
      mode: { $in: supportedModes },\r
      retryCount: { $gt: 0 },\r
      lockTime: { $lt: new Date(Date.now() - lockTimeout) }\r
    })\r
    .sort({ weight: -1, lockTime: 1 })\r
    .limit(1);\r
  }\r
\r
  // 2. 锁定任务\r
  async lockTask(taskId) {\r
    await MongoDatasetTraining.updateOne(\r
      { _id: taskId },\r
      { $set: { lockTime: new Date() } }\r
    );\r
  }\r
\r
  // 3. 执行向量化\r
  async processTask(task) {\r
    const vectors = await getVectorsByText({\r
      model: getEmbeddingModel(task.model),\r
      input: task.indexes.map(i => i.text)\r
    });\r
\r
    // 保存到 PG 向量库\r
    const indexDataIds = await saveToVectorDB(vectors);\r
\r
    // 创建 DatasetData\r
    await MongoDatasetData.create({\r
      ...task,\r
      indexes: task.indexes.map((idx, i) => ({\r
        ...idx,\r
        dataId: indexDataIds[i]\r
      }))\r
    });\r
  }\r
\r
  // 4. 完成/失败处理\r
  async completeTask(taskId, success, error) {\r
    if (success) {\r
      await MongoDatasetTraining.deleteOne({ _id: taskId });\r
    } else {\r
      await MongoDatasetTraining.updateOne(\r
        { _id: taskId },\r
        {\r
          $inc: { retryCount: -1 },\r
          $set: {\r
            errorMsg: error,\r
            lockTime: new Date('2000/1/1')\r
          }\r
        }\r
      );\r
    }\r
  }\r
}\r
```\r
\r
## 关键技术点\r
\r
### 1. 多索引机制\r
\r
**为什么需要多索引?**\r
- 大块文本可以拆分为多个小索引,提高召回精度\r
- 支持不同粒度的检索(粗粒度+细粒度)\r
\r
```typescript\r
// DatasetData 中的 indexes 数组\r
{\r
  q: "这是一段很长的文本...",\r
  indexes: [\r
    {\r
      type: 'custom',      // 自定义索引\r
      dataId: 'pg_vector_id_1',\r
      text: "第一部分索引文本"\r
    },\r
    {\r
      type: 'custom',\r
      dataId: 'pg_vector_id_2',\r
      text: "第二部分索引文本"\r
    }\r
  ]\r
}\r
```\r
\r
### 2. 混合检索(Hybrid Search)\r
\r
**结合向量检索和全文检索的优势**:\r
- 向量检索: 语义相似度,理解意图\r
- 全文检索: 精确匹配关键词,高召回\r
- RRF 融合: 互补优势,提升整体效果\r
\r
**权重配置**:\r
```typescript\r
{\r
  searchMode: 'mixedRecall',\r
  embeddingWeight: 0.5,      // 向量权重\r
  // fullTextWeight = 1 - 0.5 = 0.5\r
\r
  usingReRank: true,\r
  rerankWeight: 0.7          // 重排序权重\r
}\r
```\r
\r
### 3. 集合过滤(Collection Filter)\r
\r
**支持灵活的元数据过滤**:\r
```typescript\r
// 标签过滤\r
{\r
  tags: {\r
    $and: ["标签1", "标签2"],  // 必须同时包含\r
    $or: ["标签3", "标签4", null] // 包含任一,null表示无标签\r
  }\r
}\r
\r
// 时间过滤\r
{\r
  createTime: {\r
    $gte: '2024-01-01',\r
    $lte: '2024-12-31'\r
  }\r
}\r
```\r
\r
### 4. 向量数据库架构\r
\r
**双数据库架构**:\r
```\r
MongoDB (元数据 + 全文索引)\r
  - 存储原始文本、配置、关系\r
  - 全文搜索索引(jieba 分词)\r
\r
PostgreSQL + pgvector (向量存储)\r
  - 高维向量存储\r
  - 高效余弦相似度检索\r
  - HNSW 索引加速\r
```\r
\r
**数据流转**:\r
```\r
原始文本 → Embedding API → 向量 → PG 存储\r
         ↓\r
         索引ID 存回 MongoDB\r
\r
检索时:\r
查询文本 → 向量 → PG 召回 topK →\r
获取 dataIds → MongoDB 查询完整数据\r
```\r
\r
### 5. 图片知识库\r
\r
**特殊的图片处理流程**:\r
```typescript\r
// 1. 图片上传\r
{\r
  type: 'images',\r
  imageId: 'image_storage_id'\r
}\r
\r
// 2. 图片向量化(VLM)\r
const imageVector = await getImageEmbedding({\r
  model: vlmModel,\r
  imageId\r
});\r
\r
// 3. 图片描述映射\r
{\r
  imageDescMap: {\r
    'image_url_1': '这是一张产品图片',\r
    'image_url_2': '这是一张流程图'\r
  }\r
}\r
\r
// 4. 检索时返回预签名URL\r
const previewUrl = getDatasetImagePreviewUrl({\r
  imageId,\r
  teamId,\r
  datasetId,\r
  expiredMinutes: 60 * 24 * 7  // 7天有效\r
});\r
```\r
