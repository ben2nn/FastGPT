## 核心业务流程\r
\r
### 1. 数据导入流程\r
\r
```\r
用户上传文件/链接\r
    ↓\r
创建 DatasetCollection\r
    ↓\r
文件解析 & 预处理\r
    ↓\r
文本分块(根据 ChunkSettings)\r
    ↓\r
创建 DatasetTraining 任务\r
    ↓\r
后台队列处理:\r
  - 向量化(embedding)\r
  - 创建 PG 向量索引\r
  - 生成 DatasetData\r
  - 创建全文搜索索引(DatasetDataText)\r
    ↓\r
训练完成,可以检索\r
```\r
\r
**关键代码位置**:\r
- 文件上传: `projects/app/src/pages/api/core/dataset/collection/create/localFile.ts`\r
- 分块逻辑: `packages/service/core/dataset/collection/utils.ts`\r
- 训练控制: `packages/service/core/dataset/training/controller.ts`\r
\r
### 2. 检索流程(核心算法)\r
\r
**位置**: `packages/service/core/dataset/search/controller.ts`\r
\r
```typescript\r
// 三种检索模式\r
enum DatasetSearchModeEnum {\r
  embedding = 'embedding',        // 纯向量检索\r
  fullTextRecall = 'fullTextRecall', // 纯全文检索\r
  mixedRecall = 'mixedRecall'     // 混合检索\r
}\r
\r
// 检索流程\r
async function searchDatasetData(props) {\r
  // 1. 参数初始化和权重配置\r
  const { embeddingWeight, rerankWeight } = props;\r
\r
  // 2. 集合过滤(标签/时间/禁用)\r
  const filterCollectionIds = await filterCollectionByMetadata();\r
\r
  // 3. 多路召回\r
  const { embeddingRecallResults, fullTextRecallResults } =\r
    await multiQueryRecall({\r
      embeddingLimit: 80,  // 向量召回数量\r
      fullTextLimit: 60    // 全文召回数量\r
    });\r
\r
  // 4. RRF(倒数排名融合)合并\r
  const rrfResults = datasetSearchResultConcat([\r
    { weight: embeddingWeight, list: embeddingRecallResults },\r
    { weight: 1 - embeddingWeight, list: fullTextRecallResults }\r
  ]);\r
\r
  // 5. ReRank 重排序(可选)\r
  if (usingReRank) {\r
    const reRankResults = await datasetDataReRank({\r
      rerankModel,\r
      query: reRankQuery,\r
      data: rrfResults\r
    });\r
  }\r
\r
  // 6. 相似度过滤\r
  const scoreFiltered = results.filter(item =>\r
    item.score >= similarity\r
  );\r
\r
  // 7. Token 限制过滤\r
  const finalResults = await filterDatasetDataByMaxTokens(\r
    scoreFiltered,\r
    maxTokens\r
  );\r
\r
  return finalResults;\r
}\r
```\r
\r
**核心算法详解**:\r
\r
#### a. 向量召回 (embeddingRecall)\r
```typescript\r
// 1. 查询向量化\r
const { vectors, tokens } = await getVectorsByText({\r
  model: getEmbeddingModel(model),\r
  input: queries,\r
  type: 'query'\r
});\r
\r
// 2. PG 向量库召回\r
const recallResults = await Promise.all(\r
  vectors.map(vector =>\r
    recallFromVectorStore({\r
      teamId,\r
      datasetIds,\r
      vector,\r
      limit,\r
      forbidCollectionIdList,\r
      filterCollectionIdList\r
    })\r
  )\r
);\r
\r
// 3. 关联 MongoDB 数据\r
const dataMaps = await MongoDatasetData.find({\r
  teamId,\r
  datasetId: { $in: datasetIds },\r
  'indexes.dataId': { $in: indexDataIds }\r
});\r
```\r
\r
#### b. 全文召回 (fullTextRecall)\r
```typescript\r
// MongoDB 全文搜索\r
const results = await MongoDatasetDataText.aggregate([\r
  {\r
    $match: {\r
      teamId: new Types.ObjectId(teamId),\r
      $text: { $search: await jiebaSplit({ text: query }) },\r
      datasetId: { $in: datasetIds.map(id => new Types.ObjectId(id)) }\r
    }\r
  },\r
  {\r
    $sort: {\r
      score: { $meta: 'textScore' }\r
    }\r
  },\r
  {\r
    $limit: limit\r
  }\r
]);\r
```\r
\r
#### c. RRF 合并算法\r
```typescript\r
// 倒数排名融合(Reciprocal Rank Fusion)\r
function datasetSearchResultConcat(weightedLists) {\r
  const k = 60; // RRF 参数\r
  const scoreMap = new Map();\r
\r
  for (const { weight, list } of weightedLists) {\r
    list.forEach((item, index) => {\r
      const rrfScore = weight / (k + index + 1);\r
      scoreMap.set(item.id,\r
        (scoreMap.get(item.id) || 0) + rrfScore\r
      );\r
    });\r
  }\r
\r
  return Array.from(scoreMap.entries())\r
    .sort((a, b) => b[1] - a[1])\r
    .map(([id]) => findItemById(id));\r
}\r
```\r
\r
#### d. ReRank 重排序\r
```typescript\r
// 使用重排序模型(如 bge-reranker)\r
const { results } = await reRankRecall({\r
  model: rerankModel,\r
  query: reRankQuery,\r
  documents: data.map(item => ({\r
    id: item.id,\r
    text: `${item.q}\\n${item.a}`\r
  }))\r
});\r
\r
// 重排序结果融合到 RRF 结果\r
const finalResults = datasetSearchResultConcat([\r
  { weight: 1 - rerankWeight, list: rrfResults },\r
  { weight: rerankWeight, list: reRankResults }\r
]);\r
```\r
