## 总结\r
\r
FastGPT 知识库模块是一个完整的 RAG 系统实现,核心特点:\r
\r
1. **分层架构**: Dataset → Collection → Data → Indexes\r
2. **混合检索**: 向量 + 全文 + 重排序,灵活配置权重\r
3. **异步训练**: 队列化向量化任务,支持重试和失败处理\r
4. **双数据库**: MongoDB 存元数据,PG 存向量\r
5. **多数据源**: 支持文件/链接/API/外部集成\r
6. **灵活分块**: 段落/大小/字符多种策略\r
7. **权限控制**: 继承式权限管理\r
\r
开发时重点关注:\r
- **检索性能**: `search/controller.ts`\r
- **分块质量**: `collection/utils.ts`\r
- **训练队列**: `training/controller.ts`\r
- **数据流转**: Schema 之间的关联关系"""
