    └── pages/api/core/workflow/debug.ts     # 工作流调试API\r
```\r
\r
### 2. 执行引擎核心 (dispatch/index.ts)\r
\r
#### 核心类：WorkflowQueue\r
\r
工作流执行引擎采用队列式架构，主要特点：\r
\r
- **并发控制**: 支持最大并发数量限制（默认10个）\r
- **状态管理**: 维护节点执行状态（waiting/active/skipped）\r
- **错误处理**: 支持节点级错误捕获和跳过机制\r
- **交互支持**: 支持用户交互节点暂停和恢复\r
\r
#### 执行流程\r
\r
```typescript\r
1. 初始化 WorkflowQueue 实例\r
2. 识别入口节点（isEntry=true）\r
3. 将入口节点加入 activeRunQueue\r
4. 循环处理活跃节点队列：\r
   - 检查节点执行条件\r
   - 执行节点或跳过节点\r
   - 更新边状态\r
   - 将后续节点加入队列\r
5. 处理跳过节点队列\r
6. 返回执行结果\r
```\r
\r
### 3. 节点系统\r
