│   │   ├── runtime/                   # 运行时类型和工具\r
│   │   │   ├── constants.ts           # 运行时常量\r
│   │   │   ├── type.d.ts              # 运行时类型定义\r
│   │   │   └── utils.ts               # 运行时工具函数\r
│   │   ├── template/                  # 节点模板定义\r
│   │   │   └── system/                # 系统节点模板\r
│   │   └── type/                      # 类型定义\r
