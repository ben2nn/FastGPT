\r
## 核心特性\r
\r
### 1. 并发控制\r
- 支持最大并发节点数限制\r
- 队列式调度避免资源竞争\r
- 节点级执行状态管理\r
\r
### 2. 错误处理\r
- 节点级错误捕获\r
- catchError配置控制错误传播\r
- 错误跳过和继续执行机制\r
\r
### 3. 交互式执行\r
- 支持用户交互节点（userSelect, formInput）\r
- 工作流暂停和恢复\r
- 交互状态持久化\r
\r
### 4. 调试支持\r
- Debug模式提供详细执行信息\r
- 节点执行状态可视化\r
- 变量值追踪和检查\r
\r
### 5. 扩展性\r
- 插件系统支持自定义节点\r
- 模块化架构便于扩展\r
- 工具集成（HTTP, 代码执行等）\r
\r
## 开发指南\r
\r
### 添加新节点类型\r
\r
1. 在 `FlowNodeTypeEnum` 中添加新类型\r
2. 在 `callbackMap` 中注册调度函数\r
3. 在 `dispatch/` 目录下实现节点逻辑\r
4. 在 `template/system/` 中定义节点模板\r
\r
### 自定义工具集成\r
\r
1. 实现工具调度函数\r
2. 定义工具输入输出类型\r
3. 注册到callbackMap\r
4. 添加前端配置界面\r
\r
### 调试和测试\r
\r
1. 使用 `/api/core/workflow/debug` 进行测试\r
2. 启用debug模式查看详细执行信息\r
3. 检查节点执行状态和数据流\r
4. 使用skipNodeQueue控制执行路径\r
\r
## 性能优化\r
\r
1. **并发控制**: 合理设置maxConcurrency避免资源过载\r
2. **缓存机制**: 利用节点输出缓存减少重复计算\r
3. **流式响应**: 支持SSE实时返回执行状态\r
4. **资源管理**: 及时清理临时数据和状态\r
\r
---\r
