### 2. 核心状态管理架构\r
\r
#### Context分层设计\r
\r
前端采用分层Context架构，实现状态的高效管理和组件间通信：\r
\r
```typescript\r
// 1. ReactFlowCustomProvider - 最外层提供者\r
ReactFlowProvider → WorkflowInitContextProvider → \r
WorkflowContextProvider → WorkflowEventContextProvider → \r
WorkflowStatusContextProvider → children\r
\r
// 2. 四层核心Context\r
- WorkflowInitContext: 节点数据和基础状态\r
- WorkflowDataContext: 节点/边操作和状态\r
- WorkflowEventContext: 事件处理和UI控制\r
- WorkflowStatusContext: 保存状态和父节点管理\r
```\r
\r
#### 主Context功能 (context/index.tsx)\r
\r
```typescript\r
interface WorkflowContextType {\r
  // 节点管理\r
  nodeList: FlowNodeItemType[];\r
  onChangeNode: (props: FlowNodeChangeProps) => void;\r
  onUpdateNodeError: (nodeId: string, isError: boolean) => void;\r
  getNodeDynamicInputs: (nodeId: string) => FlowNodeInputItemType[];\r
  \r
  // 边管理\r
  onDelEdge: (edgeProps: EdgeDeleteProps) => void;\r
  \r
  // 版本控制\r
  past: WorkflowSnapshotsType[];\r
  future: WorkflowSnapshotsType[];\r
  undo: () => void;\r
  redo: () => void;\r
  pushPastSnapshot: (snapshot: SnapshotProps) => boolean;\r
  \r
  // 调试功能\r
  workflowDebugData?: DebugDataType;\r
  onNextNodeDebug: (debugData: DebugDataType) => Promise<void>;\r
  onStartNodeDebug: (debugProps: DebugStartProps) => Promise<void>;\r
  onStopNodeDebug: () => void;\r
  \r
  // 数据转换\r
  flowData2StoreData: () => StoreWorkflowType;\r
  splitToolInputs: (inputs, nodeId) => ToolInputsResult;\r
}\r
```\r
\r
